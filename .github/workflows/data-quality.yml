name: Data quality
on:
  push:
    paths:
      - "data/measures.json"
  pull_request:
    paths:
      - "data/measures.json"
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate verified measures
        run: |
          python - <<'PY'
          import json, sys, datetime
          with open("data/measures.json", encoding="utf-8") as f:
              data=json.load(f)
          errors=[]
          ids=set()
          for m in data.get("measures",[]):
              mid=m.get("id")
              if not mid: errors.append("measure without id")
              elif mid in ids: errors.append(f"duplicate id: {mid}")
              ids.add(mid)
              if m.get("review_status")=="verified":
                  for key in ("title","level","jurisdiction","effective_from","legal_basis","official_urls"):
                      if not m.get(key): errors.append(f"{mid}: missing {key}")
                  q=m.get("eligibility") or {}
                  cmy=q.get("child_max_years")
                  cmm=q.get("child_max_months")
                  if cmy is not None and cmy < 0: errors.append(f"{mid}: child_max_years < 0")
                  if cmm is not None and cmm < 0: errors.append(f"{mid}: child_max_months < 0")
                  if cmy is not None and cmm is not None and abs(cmy*12-cmm)>12:
                      errors.append(f"{mid}: child_max_months conflicts with child_max_years")
                  if q.get("children_min") is not None and q.get("children_min") < 0:
                      errors.append(f"{mid}: children_min < 0")
                  if q.get("pregnancy_weeks_min") is not None and not q.get("pregnancy"):
                      errors.append(f"{mid}: pregnancy_weeks_min set without pregnancy=true")
                  if m.get("effective_to") and m.get("effective_from") and m["effective_to"] < m["effective_from"]:
                      errors.append(f"{mid}: effective_to earlier than effective_from")
                  with open("data/sources.json", encoding="utf-8") as sf:
                      src=json.load(sf)
                  from urllib.parse import urlparse
                  source_rows=src.get("sources",[])
                  approved=tuple(sorted({urlparse(s.get("url","")).hostname for s in source_rows if urlparse(s.get("url","")).hostname}))
                  source_jur={urlparse(s.get("url","")).hostname:s.get("jurisdiction") for s in source_rows if urlparse(s.get("url","")).hostname}
                  for u in m.get("official_urls",[]):
                      if not str(u).startswith("https://"): errors.append(f"{mid}: non-https official URL")
                      host=urlparse(str(u)).hostname or ""
                      if host not in approved:
                          errors.append(f"{mid}: official URL domain not approved: {u}")
                      elif m.get("level")=="regional":
                          sj=source_jur.get(host)
                          if sj and sj!=m.get("jurisdiction"):
                              errors.append(f"{mid}: source registry jurisdiction mismatch: {host} is {sj}")
          if errors:
              print("\n".join(errors))
              sys.exit(1)
          print("Verified measures passed quality checks.")
          PY
